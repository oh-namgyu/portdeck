[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portdeck"
version = "0.1.0"
description = "A registry and map for your local dev ports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ports", "localhost", "developer-tools", "cli", "topology"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
portdeck = "portdeck.cli:main"

[project.urls]
Homepage = "https://github.com/oh-namgyu/portdeck"
Issues = "https://github.com/oh-namgyu/portdeck/issues"

[tool.setuptools.packages.find]
include = ["portdeck*"]
